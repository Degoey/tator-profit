# Gradle / JVM
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Android toolchain
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Tatorprofit wrapper configuration — one entry URL per surface
# ---------------------------------------------------------------------------
# Each surface (anggota, admin, pemilik) is a separate APK with its own package
# id, label and icon, so each one needs its own absolute entry URL.
#
# The defaults below are the emulator loopback alias for the machine running
# `npm run dev` (10.0.2.2 is the host as seen from the Android emulator), which
# only works in a debug build because debug permits cleartext HTTP.
#
# Override per invocation instead of editing this file, e.g.:
#   ./gradlew assembleRelease \
#     -Ptatorprofit.anggotaUrl=https://app.tatorprofitbos.my.id/dashboard \
#     -Ptatorprofit.adminUrl=https://app.tatorprofitbos.my.id/admin \
#     -Ptatorprofit.ownerUrl=https://app.tatorprofitbos.my.id/owner
#
# Release builds refuse any non-https value.
tatorprofit.anggotaUrl=http://10.0.2.2:3000/dashboard
tatorprofit.adminUrl=http://10.0.2.2:3000/admin
tatorprofit.ownerUrl=http://10.0.2.2:3000/owner
