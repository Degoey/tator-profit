services:
  postgres:
    image: postgres:16-alpine
    container_name: tatorprofit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tatorprofit
      POSTGRES_PASSWORD: tatorprofit
      POSTGRES_DB: tatorprofit
    ports:
      - "5432:5432"
    volumes:
      - tatorprofit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tatorprofit -d tatorprofit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tatorprofit-pgdata:
