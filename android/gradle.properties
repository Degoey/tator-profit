# Gradle / JVM
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Android toolchain
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Tatorprofit wrapper configuration
# ---------------------------------------------------------------------------
# Absolute URL the app opens on launch. It must be the deployed origin of the
# Next.js app, e.g. https://app.tatorprofit.id/admin
#
# The default below is the emulator loopback alias for the machine running
# `npm run dev` (10.0.2.2 is the host as seen from the Android emulator), which
# only works in a debug build because debug permits cleartext HTTP.
#
# Override per invocation instead of editing this file:
#   ./gradlew assembleDebug -Ptatorprofit.appUrl=https://app.tatorprofit.id/admin
#
# Release builds refuse any non-https value.
tatorprofit.appUrl=http://10.0.2.2:3000/admin
