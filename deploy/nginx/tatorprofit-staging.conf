# =============================================================================
# Nginx reverse proxy untuk TatorProfit STAGING.
#
# Certbot akan menyunting berkas ini untuk menambahkan blok TLS.
# TODO-VPS: ganti `staging.tatorprofit.example` dengan domain staging nyata.
#
# Pemasangan (di VPS):
#   sudo cp deploy/nginx/tatorprofit-staging.conf \
#     /etc/nginx/sites-available/tatorprofit-staging
#   sudo ln -s /etc/nginx/sites-available/tatorprofit-staging \
#     /etc/nginx/sites-enabled/tatorprofit-staging
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d staging.tatorprofit.example
# =============================================================================

# Batasi ukuran unggahan bukti pembayaran (dibawah 64 KiB pada API, plus overhead).
limit_req_zone $binary_remote_addr zone=tator_staging_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name staging.tatorprofit.example;

    # Certbot mengisi redirect ke HTTPS setelah sertifikat terbit.

    # Jangan mengekspos berkas tersembunyi.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # TRUST_PROXY_HEADERS=1 di .env.staging membuat aplikasi mempercayai header ini.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # Longgarkan batas hanya untuk unggahan bukti (sesuaikan bila perlu).
    location /api/deposits {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}

# Header keamanan tambahan ada di aplikasi (next.config.ts). Pasang HSTS hanya
# setelah HTTPS terbukti berfungsi. Contoh (aktifkan di blok TLS Certbot):
#   add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
